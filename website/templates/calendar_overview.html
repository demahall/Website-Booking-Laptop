{% extends "base.html" %}
{% block title %}Laptop Information{% endblock %}

{% block content %}

<link rel="stylesheet" href="/static/calendar_overview.css">
<div class="wrapper">
    <h3 align="center">Calendar Booking Overview</h3>
    <div class="row mb-3">
        <div class="col-md-4 d-flex align-items-center">
            <label for="bookingStatusDropDown" class="mr-2">Show Booking:</label>
            <select id="bookingStatusDropDown" name="bookingStatusDropDownOptions" class="form-control">
                <option value="All">All</option>
                <option value="Pending">Pending</option>
                <option value="Booked">Booked</option>
                <option value="Returned">Returned</option>
            </select>
        </div>
        <div class="col-md-8 text-right timelineButton">
            <button class="btn-nav" id="previousMonthButton">«</button>
            <button class="btn btn-secondary" id="currentMonthButton">Today</button>
            <button class="btn-nav" id="nextMonthButton">»</button>
            <span id="currentMonthYear"></span>
        </div>
    </div>

    <div class="calendar-table-wrapper">
        <div class="table-container">
            <table class="calendar-table">
                <thead>
                    <tr>
                        <th class="book-by" rowspan="2">Book By</th>
                        <th class="status" rowspan="2">Status</th>
                        <th colspan="31" id="monthHeader">July 2024</th>
                    </tr>
                    <tr id="daysHeader">
                        <!-- Day headers will be dynamically inserted here -->
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Rows for bookings will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="status-legend">
        <span class="legend-item booked">Booked</span>
        <span class="legend-item pending">Pending</span>
        <span class="legend-item returned">Returned</span>
    </div>

</div>



<script src="/static/calendar_overview.js"></script>

{% endblock %}
