<!-- logs.html -->
{% extends "common/base.html" %}

{% block title %}Logs{% endblock %}
{% block content %}

<div class="container table-container">
    <h3 class="text-center">Action Logs</h3>
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th class="action-column">Timestamp</th>
                    <th>User</th>
                    <th class="action-column">Action</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.timestamp.strftime('%d.%m.%Y %H:%M') }}</td>
                    <td>{{ log.user_id }}</td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.details }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<link rel="stylesheet" href="static/css/logs.css">
{% endblock %}
